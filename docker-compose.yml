services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: varun
      POSTGRES_USER: varun
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - varun_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varun -d varun"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  varun_postgres:
